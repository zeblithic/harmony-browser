[package]
name = "harmony-browser-app"
version = "0.1.0"
description = "Harmony Browser — content-addressed, trust-aware browsing"
authors = ["zeblithic"]
edition = "2021"
rust-version = "1.75"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
harmony-browser = { git = "https://github.com/zeblithic/harmony.git", package = "harmony-browser" }
harmony-content = { git = "https://github.com/zeblithic/harmony.git", package = "harmony-content" }
pulldown-cmark = "0.12"
ammonia = "3"
hex = "0.4"
base64 = "0.22"

# Pin transitive crypto deps to match harmony workspace versions.
# These pre-release crates have breaking changes between rc versions.
ml-dsa = "=0.1.0-rc.7"
ml-kem = "=0.3.0-rc.0"
sha3 = "=0.11.0-rc.8"
keccak = "=0.2.0-rc.2"
